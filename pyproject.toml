[project]
name = "baseline-gaur-deam"
version = "0.1.0"
description = "Baseline Replication of Shaurya Gaur (2023) Mood-Dynamic Playlist Generator with PyTorch CUDA & DEAM Dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
